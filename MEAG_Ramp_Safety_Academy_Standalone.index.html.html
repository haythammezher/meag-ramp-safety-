<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><title>MEAG Ramp Safety Academy – BEY</title><meta name="theme-color" content="#0B2545"><meta name="apple-mobile-web-app-capable" content="yes">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
:root{--bg:#EEF4FA;--card:#fff;--ink:#0B2545;--mute:#5F6F82;--line:#D5E2EE;--blue:#1E95D4;--red:#D9261C;--amber:#F2A900;--green:#2E9E6B;--navy:#0B2545;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0A1A30;--card:#13315C;--ink:#EAF3FA;--mute:#A9BCD0;--line:#24497A}}
:root[data-theme="dark"]{--bg:#0A1A30;--card:#13315C;--ink:#EAF3FA;--mute:#A9BCD0;--line:#24497A}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 Calibri,"Segoe UI",system-ui,sans-serif}
h1,h2,h3{font-family:Cambria,Georgia,serif;margin:0 0 .4em;line-height:1.2}
header{background:var(--navy);color:#fff;padding:14px 20px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
header h1{font-size:22px;margin:0;flex:1;min-width:200px}header small{color:#9AD3F0;display:block;font:14px Calibri,sans-serif}
nav{display:flex;gap:6px;padding:10px 20px;background:var(--card);border-bottom:1px solid var(--line);overflow-x:auto;position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
nav button{border:0;background:transparent;color:var(--mute);font:600 15px Calibri,"Segoe UI",system-ui,sans-serif;padding:12px 16px;border-radius:999px;cursor:pointer;white-space:nowrap}
nav button.on{background:var(--blue);color:#fff}
main{max-width:1080px;margin:0 auto;padding:20px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px}
.grid{display:grid;gap:16px}.g3{grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}.g2{grid-template-columns:2fr 1fr}
@media(max-width:800px){.g2{grid-template-columns:1fr}}
.big{font:700 40px Cambria,serif}.mute{color:var(--mute)}
.bar{height:12px;background:var(--line);border-radius:9px;overflow:hidden}.bar i{display:block;height:100%;background:var(--green);transition:width .5s}
.btn{border:0;background:var(--blue);color:#fff;font:600 15px Calibri,"Segoe UI",system-ui,sans-serif;padding:10px 18px;border-radius:10px;cursor:pointer}.btn.alt{background:transparent;color:var(--blue);border:1.5px solid var(--blue)}
.btn:focus-visible,nav button:focus-visible,.opt:focus-visible{outline:3px solid var(--amber)}
.badge{display:flex;gap:10px;align-items:center;padding:10px 12px;border-radius:12px;border:1.5px dashed var(--line);opacity:.55}.badge.got{opacity:1;border:1.5px solid var(--green)}.badge b{font-size:26px}
.opt{display:block;width:100%;text-align:left;margin:8px 0;padding:12px 14px;border-radius:10px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);font:inherit;cursor:pointer}
.opt:hover{border-color:var(--blue)}.opt.ok{border-color:var(--green);background:rgba(46,158,107,.15)}.opt.no{border-color:var(--red);background:rgba(217,38,28,.13)}
.hs{fill:transparent;cursor:pointer}.hs:hover{stroke:#F2A900;stroke-width:3;stroke-dasharray:6 4}.hs.f{stroke:#2E9E6B;stroke-width:4;fill:rgba(46,158,107,.25)}
svg{width:100%;height:auto;display:block;border-radius:12px}
@keyframes bl{50%{opacity:.2}}.bk{animation:bl 1s infinite}
input{font:inherit;padding:9px 12px;border-radius:10px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);width:100%;max-width:280px}
.fb{margin-top:10px;padding:12px;border-radius:10px;background:var(--bg)}
li{margin:6px 0}table{width:100%;border-collapse:collapse;font-size:14px}th,td{padding:8px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}textarea{font:inherit;padding:9px 12px;border-radius:10px;border:1.5px solid var(--line);background:var(--card);color:var(--ink)}
</style></head><body>
<header><div style="font-size:34px">✈️</div><h1>MEAG Ramp Safety Academy<small>Beirut–Rafic Hariri International Airport (BEY) · candidate training</small></h1><button class="btn alt" style="color:#fff;border-color:#9AD3F0" onclick="rst()">Reset progress</button><button class="btn alt" style="color:#fff;border-color:#9AD3F0" onclick="trainer()">Trainer</button></header>
<nav id="nav"></nav><main id="m"></main>
<script>
const H=[
["Worker without hi-vis in the engine intake zone",342,232,"Intake suction can pull people in. Stay out of engine zones and always wear hi-vis."],
["Loose strap on the stand (FOD)",575,282,"Foreign object debris can be blown or ingested into engines. Pick it up and bin it."],
["Belt-loader touching the fuselage",528,214,"Equipment strikes are the leading cause of ground damage. Approach slowly with a spotter and report any contact."],
["No chocks under the main wheel",460,270,"Chocks go in before anyone approaches the aircraft."],
["Beacon flashing while a worker approaches",430,148,"Beacon on means engines may be running. Stay clear until beacon is off and chocks are in."],
["GPU cable trailing across the road",655,318,"Trailing cables are trip and vehicle-strike hazards. Stow them off the walkway and road."],
["Lightning nearby while fuelling continues",172,92,"Lightning means stop outdoor work and fuelling. Shelter and wait for the all-clear."],
["Cart parked in the exhaust zone",490,296,"Jet blast can overturn carts and knock people down. Keep equipment out of exhaust zones."]];
const SC=[
{t:"Pushback under pressure",who:"You are the wing-walker",k:0,st:[
{q:"The tug begins to push. A baggage cart sits close to the left wing.",o:[["Wave at the driver and hope he sees you",0,"Hope is not a control. A clear STOP is needed."],["Give the STOP signal and call it on the radio",1,"Correct. Stop the push, then fix the problem."],["Run to move the cart while the push continues",0,"Never enter the path of moving equipment."]]},
{q:"Pushback stopped. Supervisor says: “We’re 14 minutes late. Just go.”",o:[["Agree and let the push continue",0,"Time pressure is a Dirty Dozen trap. Wing clearance is not negotiable."],["Hold until the cart is removed and the wing is clear, then confirm",1,"Correct. Stop-work authority belongs to everyone."],["Walk away and leave it to them",0,"Stay engaged. Communicate and confirm."]]}]},
{t:"Beacon still on",who:"You are the team leader",k:1,st:[
{q:"Engines are winding down, beacon on. An agent hurries toward the hold with a belt-loader.",o:[["Let them go. They know the job",0,"Complacency. Engines may still be running."],["Call “Beacon on — hold!” and stop the approach",1,"Correct. Say it loudly, clearly and early."],["Mention it afterwards",0,"Too late. Intervene now."]]},
{q:"Beacon is now off. What next?",o:[["Approach immediately",0,"Check the chocks first."],["Confirm chocks in and cones placed, then clear to approach",1,"Correct. Beacon off, chocks in, cones placed."],["Skip the chocks to save time",0,"Chocks are non-negotiable."]]}]},
{t:"I smell fuel",who:"You are a ramp agent",k:2,st:[
{q:"During refuelling you smell fuel near the left wing. Passengers are queueing.",o:[["Ignore it. Probably nothing",0,"Always treat fuel smell as real."],["Alert the fueller and hit the emergency stop",1,"Correct. Stop fuelling first."],["Check with your phone torch",0,"Never introduce an ignition source."]]},
{q:"Fuelling has stopped. What next?",o:[["Keep boarding to stay on time",0,"Hold boarding. Keep people away."],["Hold boarding, remove ignition sources, call the fire service and supervisor",1,"Correct. Secure, alert, report."],["Wipe it up yourself with rags",0,"Leave spill response to trained crews."]]}]},
{t:"Night operations",who:"You are a ramp agent",k:3,st:[
{q:"02:30. Aircraft arriving. Part of the stand lighting is out and you are tired.",o:[["Carry on in the dim light",0,"Poor visibility raises every risk."],["Report the fault, use torches, add a spotter and slow down",1,"Correct. Fix visibility and add controls."],["Skip the walk-around",0,"Checks matter most when visibility is low."]]},
{q:"At 04:00 you feel drowsy near the equipment.",o:[["Push on, shift ends soon",0,"Fatigue is highest around 03:00–05:00."],["Tell your team leader and swap to a low-risk task or rest",1,"Correct. Speak up about fatigue."],["Rely on coffee alone",0,"Caffeine does not remove fatigue risk."]]}]},
{t:"Last-minute stand change",who:"You are the team leader",k:4,st:[
{q:"The aircraft is switched to another stand with 10 minutes’ notice. Equipment is at the old stand.",o:[["Tell everyone to rush across the apron",0,"Rushing causes collisions."],["Re-brief the team, confirm routes and a clear path, then move",1,"Correct. Brief first, then move."],["Send one driver without a briefing",0,"Unbriefed moves are a hazard."]]},
{q:"The load plan changes after loading has started.",o:[["Continue with the old plan",0,"Wrong loads affect balance and safety."],["Stop and confirm the updated load sheet with load control",1,"Correct. Confirm before you continue."],["Guess the new positions",0,"Never guess load positions."]]}]},
{t:"Baggage offload",who:"You are a bag loader",k:5,st:[
{q:"A passenger is a no-show. Their bag must come off before departure.",o:[["Pull any bag that looks right",0,"Wrong bag, wrong process."],["Confirm the bag with load control and offload per procedure",1,"Correct. Identify, confirm, remove."],["Leave it, it is probably fine",0,"Unaccompanied bags must not fly."]]},
{q:"The bag is deep in the hold behind others.",o:[["Climb over the cargo",0,"Never climb on cargo."],["Use correct lifting, ask for help and use a spotter on the loader",1,"Correct. Lift safely and protect the aircraft."],["Throw bags out of the way",0,"Throwing bags injures people and damages bags."]]}]},
{t:"Technical defect found",who:"You are a ramp agent",k:6,st:[
{q:"During the walk-around you see fluid leaking under the aircraft.",o:[["Wipe it up and say nothing",0,"Never hide a defect."],["Keep people clear and call your supervisor and the engineer",1,"Correct. Secure and report."],["Tell the captain after pushback",0,"Far too late."]]},
{q:"The engineer needs more time. Operations wants departure.",o:[["Continue boarding",0,"Do not override a technical hold."],["Hold until the engineer clears the aircraft",1,"Correct. Safety before schedule."],["Remove the tag to save time",0,"Never remove a defect tag."]]}]},
{t:"Slot change",who:"You are the shift supervisor",k:7,st:[
{q:"ATC advances your departure slot by 20 minutes. Boarding is not done.",o:[["Tell everyone to rush and skip checks",0,"Rushing removes defences."],["Re-plan with operations, protect safety-critical tasks, drop optional ones",1,"Correct. Replan; do not rush."],["Say nothing and hope",0,"Communicate the change."]]},
{q:"A team member suggests skipping the FOD walk to catch the slot.",o:[["Agree to save time",0,"FOD can destroy engines."],["Keep it. Checks stay, and ask for a later slot if needed",1,"Correct. Missing a slot costs less than an accident."],["Do it after pushback",0,"Too late to be useful."]]}]},
{t:"Heat stress",who:"You are the team leader",k:8,st:[
{q:"36 °C afternoon. A colleague looks dizzy and has cramps.",o:[["Tell him to push on",0,"These are heat illness signs."],["Move him to shade, give water, cool him and alert your supervisor",1,"Correct. Cool, hydrate, report."],["Send him back after a minute",0,"Recovery needs time."]]},
{q:"The schedule leaves no time for breaks.",o:[["Skip the breaks",0,"Skipping breaks raises risk."],["Request relief and rotate tasks so everyone gets shade breaks",1,"Correct. Plan the breaks in."],["Ignore the issue",0,"Leaders must act."]]}]},
{t:"Storm approaching",who:"You are the shift supervisor",k:9,st:[
{q:"A lightning alert is issued while fuelling and loading are under way.",o:[["Carry on as normal",0,"Alerts require action."],["Stop new fuelling, finish only critical tasks and prepare to shelter",1,"Correct. Follow the alert level."],["Ignore it until a strike",0,"Do not wait for a strike."]]},
{q:"Lightning is now close. Passengers wait at the stairs.",o:[["Board quickly",0,"Passengers must not be exposed."],["Suspend ramp work, shelter staff and hold passengers inside",1,"Correct. Resume only on all-clear."],["Keep headsets on to stay in contact",0,"Remove headsets during close lightning."]]}]},
{t:"Damage you caused",who:"You are a loader driver",k:10,st:[
{q:"You clip the aircraft door frame. There is only a small scratch.",o:[["Say nothing",0,"Hidden damage can ground an aircraft later."],["Stop, report to your supervisor and take photos",1,"Correct. Report every contact."],["Cover it with a marker pen",0,"Never disguise damage."]]},
{q:"A colleague says reporting will delay the flight.",o:[["Agree and stay quiet",0,"Safety comes first."],["Report anyway. The aircraft must be inspected",1,"Correct. Just culture protects honest reporters."],["Report after your shift",0,"Report immediately."]]}]},
{t:"Faulty equipment",who:"You are a tug driver",k:11,st:[
{q:"Pre-use check: the tug brakes feel soft.",o:[["Use it anyway",0,"Faulty brakes cause collisions."],["Tag it out of service and report it",1,"Correct. No check, no use."],["Use it for short moves only",0,"Any use is unsafe."]]},
{q:"Tugs are short. Your supervisor asks you to use it.",o:[["Use it",0,"Pressure must not override safety."],["Politely refuse and ask for a replacement",1,"Correct. Stop-work authority."],["Ask a colleague to drive it",0,"That passes the risk to someone else."]]}]},
{t:'Rain and wet apron',who:'You are a ramp agent',k:12,st:[
{q:'Heavy rain. The stand is slippery and visibility is poor.',o:[['Work at normal speed','0','Wet surfaces increase slips and stopping distances.'],['Slow down, keep distance and use extra care with equipment','1','Correct. Adapt to the conditions.'],['Run to finish quickly','0','Running on wet ground causes falls.']]},
{q:'Lightning flashes in the distance while you load.',o:[['Keep loading','0','Treat lightning as a stop signal.'],['Tell your supervisor and follow the lightning procedure','1','Correct. Escalate and follow the alert level.'],['Shelter under the aircraft wing','0','Never shelter beside the aircraft.']]}]},
{t:'Unauthorised person on the ramp',who:'You are a ramp agent',k:13,st:[
{q:'You see a person without an airport pass walking toward a parked aircraft.',o:[['Ignore them','0','Unauthorised access is a safety and security risk.'],['Keep calm, keep your distance and report to your supervisor and security','1','Correct. Report, do not confront.'],['Physically stop them yourself','0','Do not put yourself at risk.']]},
{q:'A vehicle driver says they are lost and asks you to open the gate.',o:[['Open the gate to help','0','Never bypass access control.'],['Direct them to the check-in point and inform security','1','Correct. Follow the access procedure.'],['Let them follow your car','0','Tailgating defeats access control.']]}]},
{t:'Passenger bus boarding',who:'You are a team leader',k:14,st:[
{q:'A passenger bus pulls up while a belt-loader is still working at the hold.',o:[['Let both operate close together','0','Keep passengers away from active equipment.'],['Hold the bus clear, agree a safe route and use a marshaller','1','Correct. Separate people from equipment.'],['Wave the bus in without checking','0','Always control passenger routes.']]},
{q:'A passenger steps away from the group toward the engine.',o:[['Call out later','0','Act immediately.'],['Stop the group, use the guide and bring them back to the safe route','1','Correct. Control the route and keep everyone together.'],['Run after them across the stand','0','Do not create a second hazard.']]}]}];
SC.forEach(s=>s.st.forEach(t=>t.o.forEach(o=>o[1]=+o[1])));
const Q=[["When is it safe to approach an arrived aircraft?",["Engines are slowing","Beacon off and chocks in","The marshaller waves"],1],["First action if you smell fuel while refuelling?",["Keep working","Emergency stop and raise the alarm","Tell your supervisor later"],1],["Top of the hierarchy of controls?",["PPE","Eliminate the hazard","Training"],1],["A loader lightly touches the fuselage. You…",["Ignore it","Report immediately","Wait until shift end"],1],["Wing-walker unsure whether the wing is clear?",["Let the push continue","Stop the push","Ask the driver to guess"],1]];
let S={name:"",e:"",f:[],n:[],sc:{},q:{}},tab="dash",cur={s:null,i:0,done:false};
try{S=Object.assign(S,JSON.parse(localStorage.getItem("meag")||"{}"))}catch(e){}
const sv=()=>{try{localStorage.setItem("meag",JSON.stringify(S))}catch(e){}};
const pts=()=>S.f.length*10+S.n.length*10+Object.values(S.sc).filter(x=>x).length*10+Object.values(S.q).filter(x=>x).length*10,MAX=160+SC.reduce((a,s)=>a+s.st.length,0)*10+50;
const pct=()=>Math.round(pts()/MAX*100);
const nSteps=()=>SC.reduce((a,s)=>a+s.st.length,0);
const tabs=[["dash","📊 Dashboard"],["scene","🔍 Spot the hazard"],["scen","🎭 Scenarios"],["quiz","🧠 Quiz"]];
function nav(){document.getElementById("nav").innerHTML=(adm?tabs.concat([["res","📋 Results"]]):tabs).map(t=>`<button class="${tab==t[0]?"on":""}" onclick="go('${t[0]}')">${t[1]}</button>`).join("")}
function go(t){tab=t;nav();draw();scrollTo(0,0)}
function rst(){S={name:S.name,e:S.e||"",f:[],n:[],sc:{},q:{}};cur={s:null,i:0,done:false};sv();draw()}
function ring(p){const r=54,c=2*Math.PI*r;return `<svg viewBox="0 0 140 140" style="max-width:150px" role="img" aria-label="${p}% complete"><circle cx="70" cy="70" r="${r}" fill="none" stroke="var(--line)" stroke-width="14"/><circle cx="70" cy="70" r="${r}" fill="none" stroke="${p>=80?"#2E9E6B":"#1E95D4"}" stroke-width="14" stroke-linecap="round" stroke-dasharray="${c*p/100} ${c}" transform="rotate(-90 70 70)"/><text x="70" y="78" text-anchor="middle" font-size="30" font-weight="700" fill="currentColor" font-family="Cambria,serif">${p}%</text></svg>`}
function dash(){const sd=Object.keys(S.sc).length,qd=Object.keys(S.q).length,all=S.f.length+S.n.length==16&&sd==nSteps()&&qd==Q.length;
const bd=[["🔍","Hazard Hunter","Find all 16 hazards",S.f.length+S.n.length==16],["🎯","Decision Maker","Answer every scenario step",sd==nSteps()],["🏆","Safety Ace","Score 4+ in the quiz",Object.values(S.q).filter(x=>x).length>=4]];
const bar=(l,a,b)=>`<div style="margin:10px 0"><div style="display:flex;justify-content:space-between"><span>${l}</span><b>${a}/${b}</b></div><div class="bar"><i style="width:${a/b*100}%"></i></div></div>`;
return `<div class="grid g2"><div class="card"><h2>Welcome${S.name?", "+S.name:""}</h2><p class="mute">Complete all three activities to earn your badges and certificate.</p>
<label>Your name<br><input value="${S.name}" oninput="S.name=this.value;sv()" placeholder="Candidate name"></label>
<div style="margin-top:14px">${bar("Hazards found",S.f.length+S.n.length,16)}${bar("Scenario decisions",sd,nSteps())}${bar("Quiz answers",qd,Q.length)}</div>
<div style="display:flex;gap:10px;flex-wrap:wrap;margin-top:8px"><button class="btn" onclick="go('scene')">Spot the hazard</button><button class="btn" onclick="go('scen')">Scenarios</button><button class="btn" onclick="go('quiz')">Quiz</button></div></div>
<div class="card" style="text-align:center"><h3>Safety score</h3>${ring(pct())}<div class="mute">${pts()} of ${MAX} points</div></div></div>
<div class='card' style='margin-top:22px'><h3>Send your results to your trainer</h3><p class='mute'>Your name, employee ID and scores are shared with your trainer only when you press a button.</p><label>Employee ID<br><input value='${S.e||''}' oninput='S.e=this.value;sv()' placeholder='Employee ID'></label><div style='display:flex;gap:10px;flex-wrap:wrap;margin-top:12px'><button class='btn' onclick='waR()'>Send via WhatsApp</button><button class='btn alt' onclick='copyR()'>Copy result code</button><button class='btn alt' onclick='shareR()'>Share</button></div><div id='st' class='fb' style='display:none'></div></div><h3 style="margin-top:22px">Badges</h3><div class="grid g3">${bd.map(b=>`<div class="badge ${b[3]?"got":""}"><b>${b[0]}</b><div><strong>${b[1]}</strong><br><span class="mute">${b[2]}</span></div></div>`).join("")}</div>
${all?`<div class="card" style="margin-top:22px;border:2px solid var(--green);text-align:center"><h2>🎓 Certificate of completion</h2><p>${S.name||"Candidate"} completed MEAG Ramp Safety training at BEY with a score of <b>${pct()}%</b>.</p><p class="mute">${new Date().toDateString()}</p></div>`:""}`}
function scene(){const fd=i=>S.f.includes(i);
const hs=H.map((h,i)=>`<circle class="hs ${fd(i)?"f":""}" cx="${h[1]}" cy="${h[2]}" r="28" tabindex="0" role="button" aria-label="Hotspot ${i+1}" onclick="hit(${i})" onkeydown="if(event.key=='Enter')hit(${i})"/>`).join("");
return `<div class="grid g2"><div><div class="card" style="padding:10px"><svg viewBox="0 0 800 420" role="img" aria-label="Ramp scene with hidden hazards">
<rect width="800" height="270" fill="#BFE3F7"/><rect y="270" width="800" height="150" fill="#7C8A99"/><path d="M0 345H800" stroke="#F2A900" stroke-width="4" stroke-dasharray="22 14"/>
<rect x="0" y="150" width="140" height="120" fill="#5F6F82"/><g fill="#9AD3F0">${[10,45,80,115].map(x=>`<rect x="${x}" y="170" width="20" height="26"/>`).join("")}</g>
<g stroke="#5F6F82" fill="#5F6F82"><ellipse cx="170" cy="70" rx="60" ry="26"/><ellipse cx="210" cy="60" rx="45" ry="24"/></g><polygon points="180,92 160,125 176,122 164,150 200,108 182,110 196,92" fill="#F2A900"/>
<polygon points="620,165 690,88 716,88 686,190" fill="#fff" stroke="#0B2545" stroke-width="3"/><polygon points="660,100 716,88 710,104" fill="#D9261C"/>
<polygon points="400,200 500,228 535,228 470,196" fill="#E6EDF3" stroke="#0B2545" stroke-width="3"/><ellipse cx="430" cy="190" rx="235" ry="44" fill="#fff" stroke="#0B2545" stroke-width="3"/>
<path d="M215 190Q230 160 290 150L290 190Z" fill="#9AD3F0" stroke="#0B2545" stroke-width="2"/><g fill="#9AD3F0">${[320,350,380,410,440,470,500,530,560].map(x=>`<circle cx="${x}" cy="180" r="5"/>`).join("")}</g>
<path d="M240 200H640" stroke="#1E95D4" stroke-width="5"/><ellipse cx="400" cy="238" rx="42" ry="20" fill="#CFD8E0" stroke="#0B2545" stroke-width="3"/>
<circle cx="430" cy="146" r="7" fill="#D9261C" class="bk"/>
<path d="M270 232V262M460 226V262" stroke="#0B2545" stroke-width="6"/><circle cx="270" cy="268" r="10" fill="#222"/><circle cx="460" cy="268" r="13" fill="#222"/>
<circle cx="342" cy="228" r="8" fill="#E0B58F"/><rect x="334" y="236" width="16" height="26" rx="4" fill="#6B7684"/>
<path d="M575 282l16 4" stroke="#D9261C" stroke-width="5" stroke-linecap="round"/>
<rect x="545" y="244" width="95" height="30" rx="5" fill="#F2A900"/><path d="M548 248L522 208" stroke="#222" stroke-width="9"/><circle cx="560" cy="278" r="8" fill="#222"/><circle cx="625" cy="278" r="8" fill="#222"/>
<path d="M610 300Q650 290 640 320T720 336" stroke="#D9261C" stroke-width="5" fill="none"/><rect x="590" y="294" width="26" height="16" fill="#2E9E6B"/>
<rect x="462" y="285" width="58" height="22" rx="4" fill="#1E95D4"/><circle cx="474" cy="310" r="6" fill="#222"/><circle cx="508" cy="310" r="6" fill="#222"/>
${hs}</svg></div><div style="display:flex;gap:10px;margin-top:12px;align-items:center;flex-wrap:wrap"><button class="btn alt" onclick="hint()">Hint</button><span class="mute" id="hn">Click on anything that looks unsafe.</span></div></div>
<div class="card"><h3>Found ${S.f.length} of 8</h3><div class="bar"><i style="width:${S.f.length/8*100}%"></i></div><ol style="padding-left:20px">${S.f.map(i=>`<li><b>${H[i][0]}</b><br><span class="mute">${H[i][3]}</span></li>`).join("")||"<li class='mute'>Nothing yet</li>"}</ol></div></div>`}
